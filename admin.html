<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Article Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .header {
      background: #111827;
      color: white;
      padding: 20px;
    }

    .header h1 {
      font-size: 23px;
    }

    .header p {
      margin-top: 5px;
      opacity: .8;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
    }

    .card h2 {
      margin-bottom: 15px;
      font-size: 19px;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
      font-size: 15px;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .success {
      background: #16a34a;
      color: white;
    }

    .status {
      margin-top: 12px;
      padding: 12px;
      background: #f0fdf4;
      border-radius: 8px;
      display: none;
    }

    .switch {
      margin-top: 15px;
      padding: 15px;
      background: #f9fafb;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>AI Article Admin Panel</h1>
    <p>Manage news, stories and automatic AI publishing</p>
  </div>

  <div class="container">

    <div class="card">
      <h2>AI Article Generator</h2>

      <label>Article Type</label>

      <select id="type">
        <option value="news">News</option>
        <option value="story">Story</option>
        <option value="technology">Technology</option>
        <option value="sports">Sports</option>
        <option value="entertainment">Entertainment</option>
      </select>

      <label>Topic</label>

      <input
        id="topic"
        type="text"
        placeholder="Example: Today's technology news"
      >

      <label>Language</label>

      <select id="language">
        <option value="bn">Bangla</option>
        <option value="en">English</option>
      </select>

      <label>Article Length</label>

      <select id="length">
        <option value="500">500 words</option>
        <option value="1000">1000 words</option>
        <option value="1500">1500 words</option>
        <option value="2000">2000 words</option>
      </select>

      <button class="primary" onclick="generateArticle()">
        Generate with AI
      </button>

      <div id="status" class="status"></div>
    </div>


    <div class="card">
      <h2>Automatic Publishing</h2>

      <div class="switch">
        <label>
          <input type="checkbox" id="autoPublish">
          Enable automatic daily publishing
        </label>
      </div>

      <label>Daily Publishing Time</label>

      <input type="time" id="publishTime" value="09:00">

      <button class="success" onclick="saveSettings()">
        Save Settings
      </button>

      <div id="settingsStatus" class="status"></div>
    </div>


    <div class="card">
      <h2>Article Preview</h2>

      <input
        id="articleTitle"
        type="text"
        placeholder="Article title"
      >

      <label>Article Content</label>

      <textarea
        id="articleContent"
        placeholder="AI-generated article will appear here..."
      ></textarea>

      <button class="primary" onclick="publishArticle()">
        Publish Article
      </button>

      <div id="publishStatus" class="status"></div>
    </div>

  </div>


  <script>

    function generateArticle() {

      const topic = document.getElementById("topic").value;
      const type = document.getElementById("type").value;
      const language = document.getElementById("language").value;
      const length = document.getElementById("length").value;

      const status = document.getElementById("status");

      if (!topic) {
        alert("Please enter an article topic.");
        return;
      }

      status.style.display = "block";
      status.innerText =
        "AI article generation system is ready. API connection will be added next.";

      console.log({
        topic,
        type,
        language,
        length
      });
    }


    function saveSettings() {

      const enabled =
        document.getElementById("autoPublish").checked;

      const time =
        document.getElementById("publishTime").value;

      localStorage.setItem(
        "autoPublish",
        enabled
      );

      localStorage.setItem(
        "publishTime",
        time
      );

      const status =
        document.getElementById("settingsStatus");

      status.style.display = "block";
      status.innerText =
        "Settings saved successfully.";
    }


    function publishArticle() {

      const title =
        document.getElementById("articleTitle").value;

      const content =
        document.getElementById("articleContent").value;

      if (!title || !content) {
        alert("Please enter title and article content.");
        return;
      }

      localStorage.setItem(
        "articleTitle",
        title
      );

      localStorage.setItem(
        "articleContent",
        content
      );

      const status =
        document.getElementById("publishStatus");

      status.style.display = "block";
      status.innerText =
        "Article saved. Real database publishing will be connected next.";
    }

  </script>

</body>
</html>
