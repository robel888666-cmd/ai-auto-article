<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Admin Login</title>

<style>

body{
font-family:Arial;
background:#f3f4f6;
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
padding:20px
}

.box{
background:white;
padding:25px;
border-radius:15px;
width:100%;
max-width:400px;
box-shadow:0 3px 15px #0002
}

h1{
margin-bottom:20px
}

input{
width:100%;
padding:13px;
margin-bottom:12px;
border:1px solid #ddd;
border-radius:8px
}

button{
width:100%;
padding:13px;
background:#2563eb;
color:white;
border:0;
border-radius:8px;
font-weight:bold
}

#error{
margin-top:12px;
color:#dc2626
}

</style>

</head>

<body>

<div class="box">

<h1>🔐 Admin Login</h1>

<input
id="username"
placeholder="Username">

<input
id="password"
type="password"
placeholder="Password">

<button onclick="login()">
Login
</button>

<div id="error"></div>

</div>


<script>

async function login(){

const username =
document.getElementById(
"username"
).value;

const password =
document.getElementById(
"password"
).value;


const response =
await fetch(
"/api/login",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
username,
password
})

});


const data =
await response.json();


if(data.success){

location.href =
"/admin.html";

}else{

document.getElementById(
"error"
).innerText =
data.error ||
"Login failed";

}

}

</script>

</body>

</html>
